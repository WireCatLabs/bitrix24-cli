[extend]
useDefault = true

[allowlist]
paths = ['''pnpm-lock\.yaml''']

# A Bitrix24 incoming webhook is a password: its secret is a segment of the address,
# https://<portal>/rest/<user id>/<secret>/<method> (apidocs "Webhooks"), with or without the trailing slash, and with
# the `-` and `_` that parseWebhook takes. The tests' fake secret starts with wirecatfake.
[[rules]]
id = "bitrix24-webhook"
description = "Bitrix24 incoming webhook address"
regex = '''/rest/(?:api/)?\d+/([A-Za-z0-9_-]{8,})'''
secretGroup = 1
keywords = ["/rest/"]

[[rules.allowlists]]
regexes = ['''^wirecatfake''']

# A CRM holds its clients' phone numbers and e-mail addresses; neither may reach a fixture, a doc or a capture.
[[rules]]
id = "phone-number-e164"
description = "A phone number of a contact, a company or an employee"
regex = '''(?i)(?:phone|msisdn|number)["'\s:=]{1,10}\+?[1-9]\d{9,14}'''
tags = ["pii"]

[[rules.allowlists]]
regexTarget = "match"
regexes = ['''\+?71234567890''']

[[rules]]
id = "email-address"
description = "An e-mail address of a contact, a company or an employee"
regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}\b'''
tags = ["pii"]

[[rules.allowlists]]
regexTarget = "match"
regexes = [
  # The domains RFC 2606 and RFC 6761 keep for examples, and the addresses of tools that commit here.
  '''@(?:[A-Za-z0-9-]+\.)*(?:example\.(?:com|org|net)|example|test|invalid|localhost)$''',
  '''@wirecat\.dev$''',
  '''^noreply@anthropic\.com$''',
  '''@users\.noreply\.github\.com$''',
]
